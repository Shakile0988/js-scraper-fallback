name: JS Scrape Fallback

on:
  repository_dispatch:
    types: [scrape-request]

jobs:
  scrape:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/ > /dev/null; then
              echo "FlareSolverr is up"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i)"
            sleep 2
          done
          echo "FlareSolverr did not become ready in time" >&2
          exit 1

      - name: Run JS-rendering scraper
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          python scrape.py \
            --url "${{ github.event.client_payload.url }}" \
            --county "${{ github.event.client_payload.county }}" \
            --out result.json

      - name: Send result back to n8n
        run: |
          curl -sS -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d @result.json
